name: Build RealiTLScanner

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build
        shell: bash
        run: |
          set -e

          mkdir -p dist

          # Linux AMD64
          echo "Building Linux AMD64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o RealiTLScanner .

          chmod +x RealiTLScanner
          zip -j dist/RealiTLScanner-linux-amd64.zip RealiTLScanner
          rm RealiTLScanner

          # Linux ARM64
          echo "Building Linux ARM64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" \
            -o RealiTLScanner .

          chmod +x RealiTLScanner
          zip -j dist/RealiTLScanner-linux-arm64.zip RealiTLScanner
          rm RealiTLScanner

          # Windows AMD64
          echo "Building Windows AMD64..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o RealiTLScanner.exe .

          zip -j dist/RealiTLScanner-windows-amd64.zip RealiTLScanner.exe
          rm RealiTLScanner.exe

          # macOS Apple Silicon
          echo "Building macOS ARM64..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" \
            -o RealiTLScanner .

          chmod +x RealiTLScanner
          zip -j dist/RealiTLScanner-darwin-arm64.zip RealiTLScanner
          rm RealiTLScanner

          echo ""
          echo "Build completed:"
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RealiTLScanner-builds
          path: dist/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
